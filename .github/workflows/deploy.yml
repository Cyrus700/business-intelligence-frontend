name: Deploy Frontend to EC2

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "next.config.ts"
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync frontend to EC2
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.env*' \
            -e "ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/business-intelligence-frontend/"

      - name: Deploy frontend on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOSSH'
          set -euo pipefail
          cd ~/app
          if [ -f deploy/docker-compose.prod.yml ]; then COMPOSE="deploy/docker-compose.prod.yml"; else COMPOSE="business-intelligence-frontend/../deploy/docker-compose.prod.yml"; fi
          # Fallback to standalone if no monorepo compose
          if [ ! -f "$COMPOSE" ]; then
            cd ~/app/business-intelligence-frontend
            docker build -t bi-frontend:latest .
            docker rm -f bi-frontend 2>/dev/null || true
            docker run -d --name bi-frontend --restart unless-stopped -p 127.0.0.1:3000:3000 -e NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" bi-frontend:latest
          else
            docker compose -f "$COMPOSE" build frontend
            docker compose -f "$COMPOSE" up -d frontend
          fi
          sleep 5
          curl -fsS http://127.0.0.1:3000/ | head -n 20 | grep -qi "html" && echo "frontend ok"
          EOSSH
